        <script type="text/javascript">

              // initialize global variables.
              var edges;

              var network;

              var filter = {

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#1f77b4", "font": {"color": "#000000"}, "id": "Quantum Field Theory", "label": "Quantum Field Theory", "physics": true, "shape": "ellipse", "size": 20, "title": "Domain: Physics\u003cbr\u003eScale: femto", "y": 1000}, {"color": "#7f7f7f", "font": {"color": "#000000"}, "id": "Atomic Structure", "label": "Atomic Structure", "physics": true, "shape": "ellipse", "size": 20, "title": "Domain: None\u003cbr\u003eScale: None", "y": 0}, {"color": "#2b2b2b", "font": {"color": "#000000"}, "id": "Linear Algebra", "label": "Linear Algebra", "physics": false, "shape": "box", "size": 30, "title": "Domain: Mathematics\u003cbr\u003eScale: meta", "y": 1200}, {"color": "#7f7f7f", "font": {"color": "#000000"}, "id": "Quantum Mechanics", "label": "Quantum Mechanics", "physics": true, "shape": "ellipse", "size": 20, "title": "Domain: None\u003cbr\u003eScale: None", "y": 0}, {"color": "#2b2b2b", "font": {"color": "#000000"}, "id": "M001", "label": "M001", "physics": false, "shape": "box", "size": 30, "title": "Domain: Mathematics\u003cbr\u003eScale: meta", "y": 1200}, {"color": "#7f7f7f", "font": {"color": "#000000"}, "id": "P001", "label": "P001", "physics": true, "shape": "ellipse", "size": 20, "title": "Domain: None\u003cbr\u003eScale: None", "y": 0}, {"color": "#7f7f7f", "font": {"color": "#000000"}, "id": "C001", "label": "C001", "physics": true, "shape": "ellipse", "size": 20, "title": "Domain: None\u003cbr\u003eScale: None", "y": 0}, {"color": "#7f7f7f", "font": {"color": "#000000"}, "id": "B001", "label": "B001", "physics": true, "shape": "ellipse", "size": 20, "title": "Domain: None\u003cbr\u003eScale: None", "y": 0}, {"color": "#7f7f7f", "font": {"color": "#000000"}, "id": "E001", "label": "E001", "physics": true, "shape": "ellipse", "size": 20, "title": "Domain: None\u003cbr\u003eScale: None", "y": 0}, {"color": "#7f7f7f", "font": {"color": "#000000"}, "id": "T001", "label": "T001", "physics": true, "shape": "ellipse", "size": 20, "title": "Domain: None\u003cbr\u003eScale: None", "y": 0}, {"color": "#2b2b2b", "font": {"color": "#000000"}, "id": "M002", "label": "M002", "physics": false, "shape": "box", "size": 30, "title": "Domain: Mathematics\u003cbr\u003eScale: meta", "y": 1200}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "Quantum Field Theory", "label": "governs", "to": "Atomic Structure"}, {"arrows": "to", "from": "Linear Algebra", "label": "formalizes", "to": "Quantum Mechanics"}, {"arrows": "to", "from": "M001", "label": "applies to", "to": "P001"}, {"arrows": "to", "from": "M001", "label": "applies to", "to": "C001"}, {"arrows": "to", "from": "M001", "label": "applies to", "to": "B001"}, {"arrows": "to", "from": "M001", "label": "applies to", "to": "E001"}, {"arrows": "to", "from": "M001", "label": "applies to", "to": "T001"}, {"arrows": "to", "from": "M002", "label": "applies to", "to": "P001"}, {"arrows": "to", "from": "M002", "label": "applies to", "to": "C001"}]);

<!-- Right-Side Panel: Add Concept + Metadata + Edit + Domain Filter -->
<div id="right-panel" style="position: fixed; top:0; right:0; width:320px; height:100%; 
     background:#f5f5f5; border-left:1px solid #ccc; padding:15px; overflow-y:auto; 
     font-family:sans-serif; z-index:999; display:block;">

  <h3>Filter by Domain</h3>
  <select id="domain-filter" onchange="filterGraph()">
    <option value="all">All</option>
    <option value="Physics">Physics</option>
    <option value="Chemistry">Chemistry</option>
    <option value="Biology">Biology</option>
    <option value="Mathematics">Mathematics</option>
    <option value="Engineering">Engineering</option>
    <option value="Earth Science">Earth Science</option>
  </select>

  <h3>Add Concept</h3>
  <input id="concept_id" placeholder="Concept ID">
  <input id="source" placeholder="Source Concept">
  <input id="target" placeholder="Target Concept">
  <input id="relationship" placeholder="Relationship">
  <input id="domain" placeholder="Domain">
  <select id="scale">
    <option value="femto">femto</option>
    <option value="atomic">atomic</option>
    <option value="molecular">molecular</option>
    <option value="planetary">planetary</option>
    <option value="biological">biological</option>
    <option value="technological">technological</option>
    <option value="meta">meta</option>
  </select>
  <button onclick="submitEntry()">Add Concept</button>

  <hr>
  <h3>Concept Metadata</h3>
  <div><strong>Concept ID:</strong> <span id="meta-id"></span></div>
  <div><strong>Domain:</strong> <span id="meta-domain"></span></div>
  <div><strong>Scale:</strong> <span id="meta-scale"></span></div>
  <div><strong>Relationships:</strong> <ul id="meta-relationships"></ul></div>
  <button onclick="enableEdit()">Edit</button>
  <button onclick="saveEdit()">Save</button>
</div>

<script>
let editingNodeId = null;

// --------------------------
// Add Concept
// --------------------------
function submitEntry() {
  const payload = {
    concept_id: document.getElementById("concept_id").value,
    source: document.getElementById("source").value,
    target: document.getElementById("target").value,
    relationship: document.getElementById("relationship").value,
    domain: document.getElementById("domain").value,
    scale: document.getElementById("scale").value
  };
  fetch("/add_entry", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(data => {
    if(data.status==="success"){
      alert("Concept added! Reloading graph...");
      location.reload();
    } else {
      alert("Error: "+data.error);
    }
  });
}

// --------------------------
// Enable Edit
// --------------------------
function enableEdit() {
    if(editingNodeId){
        document.getElementById("domain").value = nodes.get(editingNodeId).domain || "";
        document.getElementById("scale").value = nodes.get(editingNodeId).scale || "femto";
        alert("You can now edit Domain and Scale. Click Save to update.");
    }
}

// --------------------------
// Save Edit
// --------------------------
function saveEdit() {
    if(!editingNodeId){
        alert("Click a node first to edit.");
        return;
    }
    const payload = {
        concept_id: nodes.get(editingNodeId).concept_id,
        domain: document.getElementById("domain").value,
        scale: document.getElementById("scale").value
    };
    fetch("/edit_entry", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        if(data.status==="success"){
            alert("Concept updated. Reloading graph...");
            location.reload();
        } else {
            alert("Error: "+data.error);
        }
    });
}

// --------------------------
// Filter Graph by Domain
// --------------------------
function filterGraph() {
    const selectedDomain = document.getElementById("domain-filter").value;
    nodes.get().forEach(function(node){
        if(selectedDomain==="all" || node.domain===selectedDomain){
            nodes.update({id: node.id, hidden:false});
        } else {
            nodes.update({id: node.id, hidden:true});
        }
    });
    edges.get().forEach(function(edge){
        const fromNode = nodes.get(edge.from);
        const toNode = nodes.get(edge.to);
        edges.update({id: edge.id, hidden: fromNode.hidden || toNode.hidden});
    });
}

// --------------------------
// Single merged click handler for metadata + editing
// --------------------------
network.on("click", function(params){
    if(params.nodes.length===1){
        editingNodeId = params.nodes[0];
        const nodeData = nodes.get(editingNodeId);

        document.getElementById("meta-id").innerText = nodeData.concept_id || "N/A";
        document.getElementById("meta-domain").innerText = nodeData.domain || "N/A";
        document.getElementById("meta-scale").innerText = nodeData.scale || "N/A";

        const relList = document.getElementById("meta-relationships");
        relList.innerHTML = "";
        edges.get().forEach(function(edge){
            if(edge.from===editingNodeId){
                const li = document.createElement("li");
                li.innerText = `${edge.label || ""} → ${edge.to}`;
                relList.appendChild(li);
            }
        });

        document.getElementById("right-panel").style.display = "block";
    } else {
        editingNodeId = null;
        document.getElementById("right-panel").style.display = "none";
    }
});
</script>

</body>
